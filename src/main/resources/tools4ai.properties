# Tools4AI Configuration for Advanced CLI Orchestration

# LLM Provider Configuration
# Supported providers: openai, azure, anthropic, ollama, groq
llm.provider=openai

# OpenAI Configuration
openai.api.key=${OPENAI_API_KEY}
openai.model=gpt-4
openai.base.url=https://api.openai.com/v1

# Alternative: Azure OpenAI Configuration (uncomment if using Azure)
# azure.openai.api.key=${AZURE_OPENAI_API_KEY}
# azure.openai.endpoint=${AZURE_OPENAI_ENDPOINT}
# azure.openai.deployment.name=gpt-4
# azure.openai.api.version=2024-02-15-preview

# Alternative: Ollama Configuration (uncomment if using local Ollama)
# ollama.base.url=http://localhost:11434
# ollama.model=llama2

# Tools4AI Shell Actions Configuration
tools4ai.shell.actions.enabled=true
tools4ai.shell.actions.config=shell_actions.yaml
tools4ai.shell.timeout.seconds=300

# Advanced Features
tools4ai.enable.streaming=true
tools4ai.max.retries=3
tools4ai.parallel.execution=true

# Logging Configuration
logging.level=INFO
tools4ai.verbose.logging=false

# Agent Configuration
agent.name=AdvancedCliOrchestrator
agent.description=Advanced CLI orchestration agent with chaining, pipelines, and parallel execution
agent.max.iterations=10

# CLI Execution Settings
cli.working.directory=C:/work/cli-vs-mcp
cli.shell=cmd.exe
cli.encoding=UTF-8

# Performance Tuning
cli.parallel.thread.pool.size=5
cli.execution.timeout.ms=60000

# Security Settings
cli.allowed.directories=C:/work/cli-vs-mcp/cli
cli.restricted.commands=rm,del,format,shutdown
